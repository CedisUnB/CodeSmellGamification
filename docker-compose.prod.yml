name: code-smell-gamification

services:
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    networks:
      - app_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    ports:
      - "127.0.0.1:${API_BIND_PORT:-13000}:3000"
    networks:
      - app_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-18080}:80"
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.30.10.0/24}
